<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowGen Notification</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { margin: 0; padding: 0; background-color: #060810; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #F1F5F9; }
        .wrapper { width: 100%; table-layout: fixed; background-color: #060810; padding-bottom: 40px; }
        .main { background-color: #0D1117; margin: 0 auto; width: 100%; max-width: 600px; border-spacing: 0; color: #F1F5F9; border-radius: 24px; overflow: hidden; border: 1px solid rgba(99, 102, 241, 0.12); margin-top: 40px; }
        .header { background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%); padding: 32px; text-align: center; }
        .content { padding: 40px; line-height: 1.6; }
        .footer { padding: 32px; text-align: center; font-size: 12px; color: #94A3B8; border-top: 1px solid rgba(255, 255, 255, 0.04); }
        h1 { margin: 0 0 20px; font-size: 24px; font-weight: 800; color: #FFFFFF; }
        p { margin: 0 0 16px; font-size: 16px; color: #94A3B8; }
        .button { display: inline-block; padding: 14px 32px; background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%); color: #FFFFFF !important; text-decoration: none; border-radius: 12px; font-weight: 700; font-size: 14px; margin-top: 24px; box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3); }
        .data-card { background: rgba(255, 255, 255, 0.03); border-radius: 16px; padding: 24px; margin: 24px 0; border: 1px solid rgba(255, 255, 255, 0.06); }
        .label { font-size: 11px; font-weight: 700; color: #6366F1; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .value { font-size: 16px; font-weight: 600; color: #F1F5F9; }
        .logo { width: 40px; height: 40px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <table class="main">
            <tr>
                <td class="header">
                    <img src="https://flowgen.app/logo-white.png" alt="FlowGen" width="40" height="40" class="logo">
                    <div style="font-size: 20px; font-weight: 800; color: #FFFFFF; letter-spacing: -0.5px;">FlowGen</div>
                </td>
            </tr>
            <tr>
                <td class="content">
                    {{bodyContent}}
                </td>
            </tr>
            <tr>
                <td class="footer">
                    © 2024 FlowGen OS. All rights reserved.<br>
                    One Platform. Every Team. Zero Chaos.
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
