  <path d="M11 14 L12.8 15.8 L16.5 11.5" stroke="#4F46E5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="20" y="12" width="19" height="4" rx="2" fill="white"/>

  <!-- Row 2 — in progress (half-opacity checkbox, 3/4 bar) -->
  <rect x="9" y="21" width="8" height="8" rx="2" fill="white" fill-opacity="0.75"/>
  <rect x="20" y="23" width="14" height="4" rx="2" fill="white" fill-opacity="0.75"/>

  <!-- Row 3 — todo (dim checkbox, half bar) -->
  <rect x="9" y="32" width="8" height="8" rx="2" fill="white" fill-opacity="0.35"/>
  <rect x="20" y="34" width="9" height="4" rx="2" fill="white" fill-opacity="0.35"/>
</svg>