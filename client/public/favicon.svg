      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="48" height="48" rx="12" fill="url(#bg)"/>
  <rect x="1" y="1" width="46" height="18" rx="11" fill="white" fill-opacity="0.06"/>

  <!-- Row 1 — completed (checkbox checked, bright) -->
