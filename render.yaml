services:
  # ──────────────────────────────────────────────────────────────────────────
  # FlowGen Node.js / Express Backend
  # ──────────────────────────────────────────────────────────────────────────
  - type: web
    name: flowgen-server
    runtime: node
    rootDir: server
    buildCommand: npm install --production
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false           # Set in Render dashboard
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: CLIENT_URL
        sync: false           # Set to your Vercel URL
      - key: AI_SERVICE_URL
        sync: false           # Set to your AI service Render URL
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: FlowGen <no-reply@flowgen.com>
      - key: UPLOAD_PATH
        value: uploads/
      - key: MAX_FILE_SIZE
        value: 2097152
      - key: NODE_BACKEND_API_KEY
        generateValue: true
      - key: BILLING_SIMULATE
        value: true
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # ──────────────────────────────────────────────────────────────────────────
  # FlowGen Python / Django AI Service
  # ──────────────────────────────────────────────────────────────────────────
  - type: web
    name: flowgen-ai-service
    runtime: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn flowgen_ai.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        sync: false           # Add your Render domain
      - key: NODE_BACKEND_URL
        sync: false           # Set to flowgen-server Render URL
      - key: NODE_BACKEND_API_KEY
        sync: false           # Must match server's NODE_BACKEND_API_KEY
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
